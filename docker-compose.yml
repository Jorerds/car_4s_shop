# 单机部署编排：Nginx + 后端 + Celery Worker + MySQL + Redis
# 数据卷：mysql 数据、上传图片、导出文件持久化到宿主机 ./data 目录

services:
  mysql:
    image: mysql:8.0
    restart: always
    ports:
      # 本机已装有 MySQL 占用 3306，项目独立实例用 3307，仅供宿主机开发联调
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ai_4s
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      # 本机已装有 Redis 占用 6379，6380-6479 为 Windows 保留端口段，
      # 项目独立实例映射到 16379，仅供宿主机开发联调
      - "127.0.0.1:16379:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: always
    env_file: .env
    environment:
      # 容器网络内使用服务名作为主机名
      DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-root}@mysql:3306/ai_4s?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /data/uploads
      EXPORT_DIR: /data/exports
    volumes:
      - ./data/uploads:/data/uploads
      - ./data/exports:/data/exports
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 首次启动需先执行迁移：docker compose exec backend alembic upgrade head

  celery-worker:
    build: ./backend
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-root}@mysql:3306/ai_4s?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=info
    volumes:
      - ./data/uploads:/data/uploads
      - ./data/exports:/data/exports
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"
      # - "443:443"  # 上线启用 HTTPS 后放开
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./data/uploads:/data/uploads:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
